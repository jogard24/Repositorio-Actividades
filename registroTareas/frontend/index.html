<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <h2>Registro de tareas</h2>

<!-- Formulario para buscar usuario -->
<form id="formUsuario">
  <input type="number" id="userId" placeholder="ID del usuario" required>
  <button type="submit">Buscar Usuario</button>
</form>

<!-- Aquí se mostrarán los datos del usuario -->
<div id="infoUsuario"></div>

<!-- Formulario para registrar tareas -->
<form id="formTarea" style="display:none;">
  <input type="text" id="titulo" placeholder="Título de la tarea" required>
  <input type="text" id="descripcion" placeholder="Descripción" required>
  <select id="estado" required>
    <option value="">Seleccione estado</option>
    <option value="pendiente">Pendiente</option>
    <option value="completada">Completada</option>
  </select>
  <button type="submit">Registrar Tarea</button>
</form>

<!-- Tabla dinámica de tareas -->
<table border="1">
  <thead>
    <tr>
      <th>Título</th>
      <th>Descripción</th>
      <th>Estado</th>
    </tr>
  </thead>
  <tbody id="tablaTareas"></tbody>
</table>


<script type="module" src="./../backend/app.js"></script>

</body>
</html>
